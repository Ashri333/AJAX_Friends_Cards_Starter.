<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friends Cards | AJAX + JSON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <header class="mb-4">
      <p class="eyebrow">2.02 AJAX + JSON</p>
      <h1>Friends Cards</h1>
      <p class="intro">A collection built from data. Click the button to load the people in friends.json.</p>
      <button id="loadFriends" class="btn btn-primary" type="button">Load Friends</button>
    </header>
    <p id="status" role="status">Click Load Friends to begin.</p>
    <section id="cards" class="row g-4" aria-label="Friends cards"></section>
  </main>
</body>
</html>
